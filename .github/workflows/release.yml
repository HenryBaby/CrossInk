name: Compile Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Compile release builds"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          submodules: recursive
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify PlatformIO version
        shell: bash
        run: |
          CONFIG_VERSION="$(python3 - <<'PY'
          import configparser
          config = configparser.ConfigParser()
          config.read('platformio.ini')
          print(config.get('crosspoint', 'crossink_version'))
          PY
          )"
          if [ "$CONFIG_VERSION" != "${RELEASE_VERSION}" ]; then
            echo "platformio.ini crossink_version ($CONFIG_VERSION) must match release ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Generate release notes
        run: |
          python3 scripts/generate_release_notes.py \
            --version "${{ env.RELEASE_VERSION }}" \
            --output "release-notes.md"

      - name: Build CrossInk
        env:
          CROSSPOINT_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: pio run -e tiny

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            .pio/build/tiny/firmware-v${{ env.RELEASE_VERSION }}.bin
