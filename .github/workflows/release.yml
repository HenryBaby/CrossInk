name: Compile Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Compile release builds"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          CONFIG_VERSION="$(python3 - <<'PY'
          import configparser
          config = configparser.ConfigParser()
          config.read('platformio.ini')
          print(config.get('crossink', 'version'))
          PY
          )"
          if [ "$CONFIG_VERSION" != "$VERSION" ]; then
            echo "platformio.ini version ($CONFIG_VERSION) must match release $VERSION" >&2
            exit 1
          fi
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"

  build-release:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            firmware: firmware-x3-x4
          - environment: x4-pro
            firmware: firmware-x4-pro
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build CrossInk
        env:
          CROSSINK_RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: pio run -j1 -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-v${{ needs.prepare-release.outputs.release_version }}.bin
          if-no-files-found: error

  publish-release:
    needs:
      - prepare-release
      - build-release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-firmware-*
          merge-multiple: true
          path: release-firmware

      - name: Generate release notes
        run: |
          python3 scripts/generate_release_notes.py \
            --version "${{ env.RELEASE_VERSION }}" \
            --output "release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-firmware/firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin
            release-firmware/firmware-x4-pro-v${{ env.RELEASE_VERSION }}.bin
