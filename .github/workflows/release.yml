name: Publish Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          fi

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version#v}"
          config_version="$(python3 - <<'PY'
          import configparser
          config = configparser.ConfigParser()
          config.read('platformio.ini')
          print(config.get('crossink', 'version'))
          PY
          )"
          test "$config_version" = "$version"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Locate successful main CI run for exact commit
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow ci.yml --event push --branch main --commit "$GITHUB_SHA" --status success --limit 20 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Promoting CI run $run_id"
              echo "Promoting successful CI run `$run_id` for `$GITHUB_SHA`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "No successful CI push/main run found for $GITHUB_SHA" >&2
          exit 1

      - name: Download exact-commit firmware artifacts
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci_run.outputs.run_id }}
          name: promotable-firmware-default-${{ github.sha }}
          path: release-firmware/default

      - name: Download exact-commit X4 Pro artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci_run.outputs.run_id }}
          name: promotable-firmware-x4-pro-${{ github.sha }}
          path: release-firmware/x4-pro

      - name: Validate provenance, checksums, and expected binaries
        run: |
          set -euo pipefail
          python3 scripts/release_artifacts.py validate --directory release-firmware/default \
            --commit "${{ github.sha }}" --version "$RELEASE_VERSION" --environment default
          python3 scripts/release_artifacts.py validate --directory release-firmware/x4-pro \
            --commit "${{ github.sha }}" --version "$RELEASE_VERSION" --environment x4-pro
          cp release-firmware/default/firmware-x3-x4-v${RELEASE_VERSION}.bin release-firmware/
          cp release-firmware/x4-pro/firmware-x4-pro-v${RELEASE_VERSION}.bin release-firmware/

      - name: Generate release notes
        run: python3 scripts/generate_release_notes.py --version "$RELEASE_VERSION" --output release-notes.md

      - name: Publish release with exactly two firmware files
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-firmware/firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin
            release-firmware/firmware-x4-pro-v${{ env.RELEASE_VERSION }}.bin
